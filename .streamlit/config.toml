[theme]
base = "dark"
primaryColor = "#b58cff"
backgroundColor = "#0d0b14"
secondaryBackgroundColor = "#171326"
textColor = "#f4f0ff"
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"
baseFontSize = 16
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "2rem"
paddingBottom = "3rem"

[theme.sidebar]
backgroundColor = "#110d1d"
secondaryBackgroundColor = "#1b1530"

[server]
headless = true
fileWatcherType = "none"
