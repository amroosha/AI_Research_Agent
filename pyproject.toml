[project]
name = "research-agent"
version = "0.1.0"
description = "Local agentic research assistant over O'Reilly AI books (Stage 1: data layer)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "streamlit>=1.42",
    "pymupdf",
    "transformers",
    "sentence-transformers",
    "chromadb",
    "rank-bm25",
    "pyyaml",
    "tqdm",
    "langchain-ollama",
    "httpx",
    "langgraph",
    "tavily-python",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (only run when explicitly selected with '-m slow')",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
